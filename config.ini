# 服务器配置
[server]
# 监听地址：0.0.0.0 表示监听本机所有网卡（容器内/局域网访问用）。
# ⚠️ 注意：0.0.0.0 是"监听地址"不是"访问地址"，浏览器里请用 http://127.0.0.1:8080
#    （直接用 0.0.0.0 访问会报 ERR_ADDRESS_INVALID）。
host = 0.0.0.0
port = 8080

# Milvus 配置
[milvus]
host = localhost
port = 19530
# 数据库需要自己创建
database_name = foodsafety
# 集合名：食品安全知识库统一集合（用 kb_type 字段区分 5 大知识库）
collection_name = foodsafety_kb

# LLM 配置（DeepSeek，OpenAI 兼容接口）
[llm]
model = deepseek-chat
# ⚠️ 密钥只作为「没有 .env 时的兜底」：优先级 .env / 环境变量 > 这里 > 代码默认
#    换 key 时必须同步改三处：.env 的 LLM_API_KEY、这里、以及 AGENT 项目的对应配置
api_key = 
# 密钥名称（DeepSeek 控制台上的 key 名称，仅作标识，不参与鉴权）
api_key_name = tool
base_url = https://api.deepseek.com/v1

# 运行策略：远程模型最小验证（硬限制实现见 base/run_policy.py）
[run_policy]
# 是否允许全量运行：0 = 禁止（默认），1 = 允许（必须同时传命令行 --allow-full）
# ⚠️ 对话模型为 DeepSeek 远程 API（非本地部署、按 token 计费），默认只做最小验证，
#    不做完整一轮全量跑批。确需全量时再临时改成 1，跑完记得改回 0。
allow_full_run = 0
# 单次运行最多评估多少条样本
max_samples = 2
# 单次运行最多调用多少次远程模型
max_llm_calls = 6

# Embedding / Rerank / 意图分类 模型配置（本地模型目录名，位于 models/ 下）
[model]
embedding_model = bge-m3
rerank_model = bge-reranker-large
# 意图分类模型目录名。目录不存在时系统自动回退到规则意图识别，不影响问答功能。
# 训练数据由 build_dataset.py 生成到 data/dataset/intent/，
# 运行 python train_intent.py 训练后，模型会自动落到该目录并接管策略路由。
intent_model = intent-classifier
# 计算设备：留空 = 运行时自动探测（cuda > mps > xpu > cpu）；
#          填 cpu / cuda 可强制指定。
#
# ⚠️ 本项目默认填 cpu，原因（实测结论，勿随意改回自动探测）：
#   服务启动时要同时加载两个模型到显存：
#       bge-reranker-large   磁盘 2.09 GB
#       bge-m3（Embedding）  磁盘 2.14 GB
#   本机 RTX 4060 Laptop 只有 8 GB 显存，且 Milvus 等容器已占用一部分，
#   两者同时进 CUDA 会触发 torch.OutOfMemoryError（表现为初始化中途崩溃，
#   早期版本因参数名错误甚至会直接 Segmentation fault，难以定位）。
#   实测全 CPU 模式：完整问答约 8.7s（检索 6.2s + 生成），功能完全正常。
#
#   若你的机器显存充足（>=12GB 且容器占用少），可改为 cuda 以获得更快检索；
#   或参考 core/vector_store.py 中「按模型分别指定 device」的写法做混合部署。
device = cpu

# 意图分类模型训练配置（train_intent.py 使用）
# 说明：数据集很小，epochs 偏多配合「按 macro-F1 选最优 checkpoint」，
#       实际生效的是效果最好的那一轮，不会因为 epoch 多而过拟合到最终模型上。
[train]
# 训练基座模型：auto = 复用本地 models/ 下的 embedding 模型（默认 bge-m3）。
# ⚠️ 性能提示：bge-m3 是 568M 参数的 XLM-RoBERTa，做 6 分类偏重，
#     CPU 上约 13 秒/步（一轮 20+ 分钟）；有 GPU 时会快 10 倍以上。
#     如需更轻量的基座，可下载 bge-small-zh-v1.5（约 95M）放入 models/，
#     再把此处改为 bge-small-zh-v1.5，CPU 训练速度可提升数倍。
intent_base_model = auto
# 训练轮数
epochs = 10
# 学习率（微调场景 2e-5 是稳妥起点）
learning_rate = 2e-5
# 批大小（CPU 训练建议 8，GPU 可调到 16 或 32）
batch_size = 8
# 从训练集内部再切出的验证集占比（用于早停与选最优 checkpoint）
# 注意：这与 intent_eval.jsonl 那个固定测试集不同，测试集只在最后评估一次，
#       不参与调参，避免分数失真。
val_ratio = 0.2
# 随机种子
seed = 42

# 检索参数配置
[retrieval]
# 父块/子块切分大小与重叠
parent_chunk_size = 512
child_chunk_size = 120
parent_chunk_overlap = 128
child_chunk_overlap = 30
# 混合检索召回数量
retrieval_k = 5
# 重排后最终送入提示词的父块数量
candidate_m = 3
# 检索相似度阈值（低于该分数视为未命中，用于拒答）
# 说明：BGE-Reranker 输出为 0~1 的相关性分数。0.3 偏松，容易让"沾边但不对题"
#       的片段蒙混过关；调到 0.5 可显著减少幻觉，代价是更保守（可能误拒边缘问题）。
#       如需更严格可继续上调至 0.6~0.7。
score_threshold = 0.5
# IVF_FLAT 索引检索时扫描的聚类簇数（索引 nlist=128）
# 说明：nprobe 决定实际扫描几个簇，直接影响召回率。
#       nprobe=10  → 扫 8%，快但容易漏掉簇边界附近的正确答案
#       nprobe=32  → 扫 25%，召回率明显提升，延迟增加可忽略（推荐值）
#       nprobe=128 → 全扫描，等价暴力检索，最准但最慢
#       经验：nprobe ≈ nlist 的 1/4 ~ 1/3。
nprobe = 32

# Backtrack 回溯检索策略
# 说明：当首轮检索的最高 rerank 分数低于 backtrack_trigger_threshold 时，
#       说明"问题表述"和"知识库表述"之间存在语义鸿沟（Gap）。
#       此时回溯到「问题改写」环节：让 LLM 把原始问题改写成更贴近法规
#       条文体/标准术语的检索式，再跑一轮检索，取两轮中更优的结果。
#       这是「检索失败后不直接拒答，而是先自救一次」的关键机制。
[backtrack]
# 是否启用 Backtrack 策略（关闭时检索失败直接走拒答）
enabled = true
# 触发回溯的分数阈值：首轮最高分低于此值就回溯
# 注意：应略低于 score_threshold，给「分数不够但相关」的问题一次改写机会
trigger_threshold = 0.45
# 最大回溯轮数（每轮都改写一次问题，轮数过多会显著增加延迟）
max_rounds = 2
# 低于此分则判定回溯无效、直接拒答（兜底线）
give_up_threshold = 0.30
# 回溯时是否把「上一轮已检索到的低分片段」作为改写参考（可提升改写质量）
use_prior_docs = true
# 每次回溯合并的候选块数量
merge_k = 8

# 多用户内容隔离（需求 4.2 行级权限过滤）
# 说明：把「谁在问」映射成「能看哪些密级 / 哪些部门」的过滤条件，检索时自动附加到
#       Milvus 标量表达式；检索结果出口再按 visible_to 白名单校验一次（纵深防御）。
# 格式约定（三行都是一行式紧凑写法，分号分项、冒号分键值、竖线分列表）：
#   role_levels      角色 → 可见密级
#   role_departments 角色 → 所属部门（留空表示只可见 all 部门的公共内容）
#   kb_defaults      知识库 → 默认密级:归属部门
# 密级语义：public（对外可查，如国标） < internal（内部规范，如 SOP） < restricted（受限，如事故案例）
#
# 单个文档可在**文件开头**用声明块覆盖知识库默认值（详见 core/access_control.py）：
#   <!-- access_level: restricted -->
#   <!-- department: quality -->
#   <!-- visible_to: quality,admin -->
[access]
# 总开关：改为 false 时不做任何权限过滤，行为与改造前完全一致（便于排查问题）
enabled = true
# 调用方未传角色时的兜底角色。
# ⚠️ 默认给 staff（public + internal）而不是 admin：既覆盖 FoodAgent 的法规/营养检索，
#    又拿不到 restricted 的事故案例；未定义的角色也一律退化为它，避免"不认识就全放开"。
default_role = staff
role_levels = public:public;staff:public|internal;kitchen:public|internal;quality:public|internal|restricted;supplier:public|internal;admin:public|internal|restricted
role_departments = public:;staff:;kitchen:kitchen;quality:quality;supplier:purchasing;admin:quality|kitchen|purchasing|management
kb_defaults = regulation:public:all;sop:internal:all;case:restricted:quality;nutrition:public:all;supplier:internal:purchasing;faq:public:all

# Redis 缓存（三级缓存：L1 进程内 → L2 Redis → L3 回源）
# 说明：以下三类查询重复度高但计算昂贵，缓存收益显著：
#       ① Embedding 向量（同一 query 反复编码）
#       ② 检索结果（同一问题反复检索）
#       ③ LLM 答案（FAQ 类问题答案高度重复）
# 未启用时自动降级为进程内字典缓存（单机可用，重启失效）。
[redis]
enabled = false
host = localhost
port = 6379
; db 库隔离：本机 Redis 已被其他项目占用 db0，FoodSafetySystem 用 db1，FoodAgent 用 db2
db = 1
password = change-me
# 各类缓存的 TTL（秒）
embedding_ttl = 86400
retrieval_ttl = 1800
answer_ttl = 3600
# 键前缀（多环境共用同一 Redis 时用于隔离）
key_prefix = foodsafety:
# 缓存条目上限（按知识库版本变更时手动清空）
max_entries = 10000

# RAGAS 评估配置（scripts/evaluate_ragas.py 使用）
[ragas]
# 是否启用（评估为离线批处理，默认关闭，不影响在线服务）
enabled = false
# 评估问题集文件（JSONL，每行一个 {"question":..., "ground_truth":...}）
eval_file = data/eval/ragas_eval_set.jsonl
# 评估结果输出目录
output_dir = data/eval/results
# 单次评估的样本数上限（0 = 全量；小样本快速验证用）
sample_size = 0
# 并发数（评估会大量调用 LLM，注意额度与限流）
concurrency = 1
# 评估用的 LLM（默认复用 [llm] 配置；此处可指定更强的模型做裁判）
judge_model =
# 关注的指标（逗号分隔）
# 可选：faithfulness 忠实度 / answer_relevancy 答案相关性 /
#       context_precision 上下文精确率 / context_recall 上下文召回率
metrics = faithfulness,answer_relevancy,context_precision,context_recall

# 应用配置
[app]
# 食品安全咨询热线（信息不足时提示用户）
service_phone = 400-000-0000
# 对话历史轮数上限
history_rounds = 5
# 提示词最大字符数
max_prompt_length = 4096
